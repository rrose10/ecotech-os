# EcoTech OS on a NAS / small server.  Start with:  sh deploy/install.sh
services:
  app:
    build: ./backend
    restart: unless-stopped
    env_file: .env.docker
    environment:
      AUTORUN_ENABLED: "true"      # runs database migrations on every start
    ports:
      - "${APP_PORT:-8088}:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage:/var/www/html/storage
      - ./backups:/var/www/html/storage/app/backups

  scheduler:
    build: ./backend
    restart: unless-stopped
    env_file: .env.docker
    environment:
      AUTORUN_ENABLED: "false"
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage:/var/www/html/storage
      - ./backups:/var/www/html/storage/app/backups

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ecotech_os
      MARIADB_USER: ecotech
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Dhaka
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  storage:
  dbdata:
